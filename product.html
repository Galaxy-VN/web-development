<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Chi Tiết Sản Phẩm</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="container py-4">
      <a href="items.html" class="btn btn-secondary mb-3">&larr; Quay lại danh sách</a>

      <div id="product-details" class="card">
        <div class="row g-0">
          <div class="col-md-6" id="product-image-wrapper">
            <!-- image inserted by JS -->
          </div>
          <div class="col-md-6">
            <div class="card-body">
              <h1 id="product-name" class="card-title"></h1>
              <p id="product-desc" class="card-text"></p>
              <h3 id="product-price" class="text-primary"></h3>
              <div class="mt-4">
                <a href="items.html" class="btn btn-outline-primary">Tiếp tục mua sắm</a>
                <button id="buy-btn" class="btn btn-success ms-2">Mua ngay</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      const products = {
        1: {
          id:1,
          name: 'Sản Phẩm 1',
          price: '$100',
          img: 'assets/images/ussr_t_90m_2020.png',
          desc: 'Mô tả chi tiết cho sản phẩm 1. Thông tin thêm về tính năng và lợi ích.'
        },
        2: {
          id:2,
          name: 'Sản Phẩm 2',
          price: '$150',
          img: 'assets/images/ussr_t_80bvm.png',
          desc: 'Mô tả chi tiết cho sản phẩm 2. Thông tin thêm về tính năng và lợi ích.'
        },
        3: {
          id:3,
          name: 'Sản Phẩm 3',
          price: '$120',
          img: 'assets/images/ussr_t_72b3_arena_m.png',
          desc: 'Mô tả chi tiết cho sản phẩm 3. Thông tin thêm về tính năng và lợi ích.'
        },
        4: {
          id:4,
          name: 'Sản Phẩm 4',
          price: '$80',
          img: 'assets/images/ussr_pantsyr_s1.png',
          desc: 'Mô tả chi tiết cho sản phẩm 4. Thông tin thêm về tính năng và lợi ích.'
        },
        5: {
          id:5,
          name: 'Sản Phẩm 5',
          price: '$200',
          img: 'assets/images/ussr_buk_m3_fcs.png',
          desc: 'Mô tả chi tiết cho sản phẩm 5. Thông tin thêm về tính năng và lợi ích.'
        }
      };

      function getQueryParam(name){
        const url = new URL(window.location.href);
        return url.searchParams.get(name);
      }

      function renderProduct(id){
        const p = products[id];
        if(!p){
          document.getElementById('product-details').innerHTML = '<div class="p-4">Sản phẩm không tìm thấy. <a href="index.html">Trở về</a></div>';
          return;
        }
        document.getElementById('product-name').textContent = p.name;
        document.getElementById('product-desc').textContent = p.desc;
        document.getElementById('product-price').textContent = p.price;
        const imgWrap = document.getElementById('product-image-wrapper');
        imgWrap.innerHTML = `<img src="${p.img}" class="img-fluid rounded-start" alt="${p.name}">`;
        document.getElementById('buy-btn').addEventListener('click', ()=>{
          alert('Thêm ' + p.name + ' vào giỏ (demo)');
        });
      }

      const id = getQueryParam('id') || '1';
      renderProduct(id);
    </script>
  </body>
</html>
